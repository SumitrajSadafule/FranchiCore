# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# Force server to bind to all network interfaces
server.address=0.0.0.0

# PostgreSQL Configuration (values come from Render Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=POSTGRESQL

# Logging
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS}

# Email Configuration (values from Render Environment Variables)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email sender details
app.email.sender=${APP_EMAIL_SENDER}
app.email.sender-name=${APP_EMAIL_SENDER_NAME:MAC's Franchise Portal}


# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://franchicore.vercel.app}
cors.allowed.methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.allowed.headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
cors.allow.credentials=true